[project]
name = "prelabel"
version = "0.3.0"
description = "The missing layer between inference and annotation."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Sojid" }]
dependencies = [
    "fastapi>=0.110,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "python-multipart>=0.0.9",
    "ultralytics>=8.1,<9.0",
    "onnxruntime>=1.16,<2.0",
    "openvino>=2024.0",
    "lap>=0.5",
    "opencv-python>=4.8,<5.0",
    "numpy>=1.24,<3.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "httpx>=0.27",
]

[project.scripts]
prelabel = "run:main"

[project.urls]
Homepage = "https://github.com/2005sojid/prelabel"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["prelabel", "prelabel.api", "prelabel.engines", "prelabel.media"]

# --- tests -------------------------------------------------------------------

[tool.pytest.ini_options]
minversion = "8.0"
# Prepend the project root so `import prelabel` and `import tests.*` resolve here and
# not to a same-named package that happens to be installed.
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs ultralytics and downloads model weights",
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning",
]

[tool.coverage.run]
source = ["prelabel"]
branch = true
omit = ["*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]

# --- lint --------------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import order
    "B",    # bugbear
    "UP",   # pyupgrade
    "SIM",  # simplify
    "C4",   # comprehensions
    "RET",  # return style
]
ignore = [
    "B008",   # FastAPI's Depends()/File() defaults are the documented idiom
    "E501",   # long lines are caught by the formatter, not the linter
    "SIM105", # contextlib.suppress is not always clearer than try/except
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["prelabel", "tests"]
