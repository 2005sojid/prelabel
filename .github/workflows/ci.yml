name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU torch: the default wheel drags in a CUDA runtime CI cannot use.
          pip install --index-url https://download.pytorch.org/whl/cpu torch torchvision
          pip install -e ".[dev]"

      - name: Lint
        run: ruff check prelabel tests run.py

      - name: Test
        # The integration marker downloads model weights and exports to every
        # format; it runs in its own job so a network hiccup cannot fail the
        # whole matrix.
        #
        # The gate is set against *this* subset, not the full suite. Excluding
        # the format tests also excludes most of the engine code they exercise,
        # so the fast run sits around 75% where the full suite reaches 84%.
        run: pytest -m "not integration" --cov=prelabel --cov-report=term-missing --cov-fail-under=70

  integration:
    name: Format integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Every format loads and infers
        run: pytest -m integration -v

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Unit tests
        run: npm test
      - name: Every module parses as an ES module
        run: |
          for file in $(find frontend/assets/js -name '*.js'); do
            cp "$file" "/tmp/$(echo "$file" | tr '/' '_').mjs"
            node --check "/tmp/$(echo "$file" | tr '/' '_').mjs"
          done
